                valueFrom:
                  configMapKeyRef:
                    name: orders-api-config
                    key: FEATURE_FLAGS
            readinessProbe:
              httpGet:
                path: /readyz                # fix 1: the path the app serves
                port: http
            livenessProbe:
              httpGet:
                path: /healthz
                port: http
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: orders-api
    namespace: orders
  spec:
    selector:
      app: orders-api                      # fix 4: the selector typo
    ports:
      - name: http
        port: 80
        targetPort: http                   # fix 2: the container's port
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: default-deny
    namespace: orders
  spec:
    podSelector: {}
    policyTypes: [Ingress, Egress]
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-web-to-api
    namespace: orders
  spec:
    podSelector:
      matchLabels:
        app: orders-api
    policyTypes: [Ingress]
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: web
            podSelector:
              matchLabels:
                app: web
        ports:
          - port: 8080                     # fix 5: the pod port, not the Service port
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-dns
    namespace: orders
  spec:
    podSelector: {}
    policyTypes: [Egress]
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - { port: 53, protocol: UDP }
          - { port: 53, protocol: TCP }
