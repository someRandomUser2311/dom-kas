lab: ch13/lab-c
solution: |
  trigger:
    branches:
      include: [main]
    paths:
      include: [infra/bicep/*]
  pr:
    branches:
      include: [main]

  stages:
    - stage: Lint
      jobs:
        - job: lint
          pool: { vmImage: ubuntu-latest }
          steps:
            - script: az bicep lint --file infra/bicep/main.bicep && az bicep build --file infra/bicep/main.bicep

    - stage: WhatIf
      dependsOn: Lint
      jobs:
        - job: whatif
          pool:
            name: pool-orders-prod
          steps:
            - task: AzureCLI@2
              inputs:
                azureSubscription: sc-orders-infra-prod   # workload identity federation
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  az deployment group what-if \
                    --resource-group rg-orders-prod \
                    --template-file infra/bicep/main.bicep \
                    --parameters infra/bicep/main.prod.bicepparam

    - stage: Deploy
      dependsOn: WhatIf
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
        - deployment: deploy
          pool:
            name: pool-orders-prod
          environment: infra-prod          # approval after reviewing the what-if
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                  - task: AzureCLI@2
                    inputs:
                      azureSubscription: sc-orders-infra-prod
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        az stack group create \
                          --name stack-orders-prod \
                          --resource-group rg-orders-prod \
                          --template-file infra/bicep/main.bicep \
                          --parameters infra/bicep/main.prod.bicepparam \
                          --action-on-unmanage deleteResources \
                          --deny-settings-mode none \
                          --yes
---
