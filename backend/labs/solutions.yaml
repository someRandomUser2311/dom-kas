# Complete reference solutions for labs whose course page only shows an
# excerpt or points to a lesson. Each must pass its own lab's rules (the API
# sweep in the test suite checks this). Shown to learners on "View solution".
lab: ch03/lab
solution: |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: orders-api
    namespace: orders
    labels:
      app: orders-api
  spec:
    # no replicas: the HPA owns the replica count
    selector:
      matchLabels:
        app: orders-api
    template:
      metadata:
        labels:
          app: orders-api
      spec:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: orders-api
        containers:
          - name: api
            image: contosoacr.azurecr.io/orders-api:1.4.2
            ports:
              - name: http
                containerPort: 8080
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                memory: 512Mi
            startupProbe:
              httpGet: { path: /healthz, port: http }
              periodSeconds: 5
              failureThreshold: 30
            readinessProbe:
              httpGet: { path: /readyz, port: http }
              periodSeconds: 5
            livenessProbe:
              httpGet: { path: /healthz, port: http }
              periodSeconds: 10
              failureThreshold: 3
  ---
  apiVersion: autoscaling/v2
  kind: HorizontalPodAutoscaler
  metadata:
    name: orders-api
    namespace: orders
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: orders-api
    minReplicas: 2
    maxReplicas: 10
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
  ---
  apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata:
    name: orders-api
    namespace: orders
  spec:
    maxUnavailable: 1
    selector:
      matchLabels:
        app: orders-api
---
lab: ch04/lab
solution: |
  #!/usr/bin/env bash
  set -euo pipefail

  RG=rg-orders-dev
  CLUSTER=aks-orders-dev
  LOCATION=westeurope

  az group create --name "$RG" --location "$LOCATION"

  az aks create \
    --resource-group "$RG" --name "$CLUSTER" --location "$LOCATION" \
    --tier standard \
    --nodepool-name system --node-count 2 --zones 1 2 3 \
    --node-vm-size Standard_D4ds_v5 \
    --nodepool-taints CriticalAddonsOnly=true:NoSchedule \
    --network-plugin azure --network-plugin-mode overlay \
    --network-dataplane cilium --pod-cidr 192.168.0.0/16 \
    --enable-oidc-issuer --enable-workload-identity \
    --enable-aad --enable-azure-rbac --disable-local-accounts \
    --auto-upgrade-channel patch --node-os-upgrade-channel NodeImage \
    --generate-ssh-keys

  az aks nodepool add \
    --resource-group "$RG" --cluster-name "$CLUSTER" --name user \
    --mode User --zones 1 2 3 --node-vm-size Standard_D4ds_v5 \
    --enable-cluster-autoscaler --min-count 2 --max-count 6
---
lab: ch06/lab
solution: |
  #!/usr/bin/env bash
  # Run from the repository root. --file . uploads the working folder, so the
  # path in --command is relative to it.
  set -euo pipefail

  az aks command invoke \
    --resource-group rg-orders-prod \
    --name aks-orders-prod \
    --command "kubectl apply -f k8s/base/ -n orders" \
    --file .
---
lab: ch08/lab
solution: |
  # k8s/gateway/gateway.yaml
  apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: shop-gateway
    namespace: gateway-infra
  spec:
    gatewayClassName: azure-alb-external
    listeners:
      - name: https
        protocol: HTTPS
        port: 443
        hostname: shop.contoso.example
        tls:
          mode: Terminate
          certificateRefs:
            - kind: Secret
              name: shop-contoso-tls   # created by cert-manager / Key Vault, never in Git
        allowedRoutes:
          namespaces:
            from: Selector
            selector:
              matchLabels:
                shop-routes: allowed
      - name: http
        protocol: HTTP
        port: 80
        hostname: shop.contoso.example
        allowedRoutes:
          namespaces:
            from: Same
  ---
  # HTTP only redirects to HTTPS
  apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: http-to-https
    namespace: gateway-infra
  spec:
    parentRefs:
      - name: shop-gateway
        sectionName: http
    hostnames: [shop.contoso.example]
    rules:
      - filters:
          - type: RequestRedirect
            requestRedirect:
              scheme: https
              statusCode: 301
  ---
  # k8s/gateway/orders-route.yaml
  apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: orders-api
    namespace: orders
  spec:
    parentRefs:
      - name: shop-gateway
        namespace: gateway-infra
        sectionName: https
    hostnames: [shop.contoso.example]
    rules:
      - matches:
          - path: { type: PathPrefix, value: /api }
        backendRefs:
          - name: orders-api
            port: 80
  ---
  # k8s/gateway/web-route.yaml
  apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: web
    namespace: web
  spec:
    parentRefs:
      - name: shop-gateway
        namespace: gateway-infra
        sectionName: https
    hostnames: [shop.contoso.example]
    rules:
      - matches:
          - path: { type: PathPrefix, value: / }
        backendRefs:
          - name: web
            port: 80
---
lab: ch09/lab
solution: |
  # Default-deny (both directions) and DNS in every namespace
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: default-deny, namespace: web }
  spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: default-deny, namespace: orders }
  spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: default-deny, namespace: db }
  spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: allow-dns, namespace: web }
  spec:
    podSelector: {}
    policyTypes: [Egress]
    egress:
      - to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
            podSelector: { matchLabels: { k8s-app: kube-dns } }
        ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: allow-dns, namespace: orders }
  spec:
    podSelector: {}
    policyTypes: [Egress]
    egress:
      - to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
            podSelector: { matchLabels: { k8s-app: kube-dns } }
        ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: allow-dns, namespace: db }
  spec:
    podSelector: {}
    policyTypes: [Egress]
    egress:
      - to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
            podSelector: { matchLabels: { k8s-app: kube-dns } }
        ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
  ---
  # web: in from the gateway, out to orders-api
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: web-flows, namespace: web }
  spec:
    podSelector: { matchLabels: { app: web } }
    policyTypes: [Ingress, Egress]
    ingress:
      - from:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: gateway-infra } }
        ports: [{ port: 8080 }]
    egress:
      - to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: orders } }
            podSelector: { matchLabels: { app: orders-api } }
        ports: [{ port: 8080 }]
  ---
  # orders-api: in from the gateway and web
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: orders-api-ingress, namespace: orders }
  spec:
    podSelector: { matchLabels: { app: orders-api } }
    policyTypes: [Ingress]
    ingress:
      - from:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: gateway-infra } }
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: web } }
            podSelector: { matchLabels: { app: web } }
        ports: [{ port: 8080 }]
  ---
  # orders-api and orders-worker: out to postgres
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: orders-to-db, namespace: orders }
  spec:
    podSelector:
      matchExpressions:
        - { key: app, operator: In, values: [orders-api, orders-worker] }
    policyTypes: [Egress]
    egress:
      - to:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: db } }
            podSelector: { matchLabels: { app: postgres } }
        ports: [{ port: 5432 }]
  ---
  # postgres: in from orders-api and orders-worker only
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: { name: postgres-ingress, namespace: db }
  spec:
    podSelector: { matchLabels: { app: postgres } }
    policyTypes: [Ingress]
    ingress:
      - from:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: orders } }
            podSelector:
              matchExpressions:
                - { key: app, operator: In, values: [orders-api, orders-worker] }
        ports: [{ port: 5432 }]
---
lab: ch10/lab
solution: |
  # k8s/overlays/prod/kustomization.yaml
  apiVersion: kustomize.config.k8s.io/v1beta1
  kind: Kustomization
  namespace: orders
  resources:
    - ../../base
  images:
    - name: contosoacr.azurecr.io/orders-api
      newTag: "1.4.2"
  patches:
    - target: { kind: Deployment, name: orders-api }
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: orders-api
        spec:
          template:
            spec:
              containers:
                - name: api
                  resources:
                    requests:
                      cpu: 500m
                      memory: 512Mi
                    limits:
                      memory: 1Gi
    - target: { kind: HorizontalPodAutoscaler, name: orders-api }
      patch: |-
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: orders-api
        spec:
          minReplicas: 4
          maxReplicas: 20
---
lab: ch10/lab-b
solution: |
  # azure-pipelines.yml (after the Build stage)
    - stage: DeployDev
      dependsOn: Build
      condition: succeeded()
      jobs:
        - template: templates/deploy.yml
          parameters:
            environment: dev
            serviceConnection: sc-orders-dev
            cluster: aks-orders-dev
            resourceGroup: rg-orders-dev
            imageTag: $(Build.BuildId)
            pool:
              vmImage: ubuntu-latest

    - stage: DeployProd
      dependsOn: DeployDev
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
        - template: templates/deploy.yml
          parameters:
            environment: prod
            serviceConnection: sc-orders-prod
            cluster: aks-orders-prod
            resourceGroup: rg-orders-prod
            imageTag: $(Build.BuildId)
            pool:
              name: pool-orders-prod   # Managed DevOps Pool inside the VNet

  # templates/deploy.yml
  parameters:
    - name: environment
      type: string
    - name: serviceConnection
      type: string
    - name: cluster
      type: string
    - name: resourceGroup
      type: string
    - name: imageTag
      type: string
    - name: pool
      type: object

  jobs:
    - deployment: deploy_orders_api
      pool: ${{ parameters.pool }}
      environment: ${{ parameters.environment }}
      strategy:
        runOnce:
          deploy:
            steps:
              - task: KubernetesManifest@1
                inputs:
                  action: deploy
                  connectionType: azureResourceManager
                  azureSubscriptionConnection: ${{ parameters.serviceConnection }}
                  azureResourceGroup: ${{ parameters.resourceGroup }}
                  kubernetesCluster: ${{ parameters.cluster }}
                  namespace: orders
                  manifests: $(Pipeline.Workspace)/manifests/${{ parameters.environment }}/*.yaml
                  containers: contosoacr.azurecr.io/orders-api:${{ parameters.imageTag }}
---
lab: ch11/lab
solution: |
    - stage: DeployProd
      dependsOn: [Build, DeployDev]
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
        - deployment: canary_orders_api
          pool:
            name: pool-orders-prod
          environment: prod.orders          # approvals live on the prod environment
          strategy:
            canary:
              increments: [10, 50]
              deploy:
                steps:
                  - task: KubernetesManifest@1
                    inputs:
                      action: deploy
                      connectionType: azureResourceManager
                      azureSubscriptionConnection: sc-orders-prod
                      azureResourceGroup: rg-orders-prod
                      kubernetesCluster: aks-orders-prod
                      namespace: orders
                      strategy: canary
                      percentage: $(strategy.increment)
                      manifests: $(Pipeline.Workspace)/manifests/*.yaml
                      containers: contosoacr.azurecr.io/orders-api:$(Build.BuildId)
              postRouteTraffic:
                steps:
                  - script: |
                      # fails the job when the canary's 5xx ratio is above 1%
                      ./scripts/canary-error-rate.sh --namespace orders --max-ratio 0.01 || exit 1
                    displayName: Compare canary vs stable 5xx ratio
              on:
                failure:
                  steps:
                    - task: KubernetesManifest@1
                      inputs:
                        action: reject
                        connectionType: azureResourceManager
                        azureSubscriptionConnection: sc-orders-prod
                        azureResourceGroup: rg-orders-prod
                        kubernetesCluster: aks-orders-prod
                        namespace: orders
                        strategy: canary
                        manifests: $(Pipeline.Workspace)/manifests/*.yaml
                success:
                  steps:
                    - task: KubernetesManifest@1
                      inputs:
                        action: promote
                        connectionType: azureResourceManager
                        azureSubscriptionConnection: sc-orders-prod
                        azureResourceGroup: rg-orders-prod
                        kubernetesCluster: aks-orders-prod
                        namespace: orders
                        strategy: canary
                        manifests: $(Pipeline.Workspace)/manifests/*.yaml
                        containers: contosoacr.azurecr.io/orders-api:$(Build.BuildId)
---
lab: ch12/lab
solution: |
  # versions.tf
  terraform {
    required_version = ">= 1.9"
    required_providers {
      azurerm = {
        source  = "hashicorp/azurerm"
        version = "~> 4.20"
      }
    }
    backend "azurerm" {
      resource_group_name  = "rg-tfstate"
      storage_account_name = "sttfstatecontoso"
      container_name       = "tfstate"
      key                  = "orders/dev.tfstate"
      use_azuread_auth     = true
    }
  }

  provider "azurerm" {
    features {}
  }

  # variables.tf
  variable "environment" {
    type = string
    validation {
      condition     = contains(["dev", "prod"], var.environment)
      error_message = "environment must be dev or prod."
    }
  }

  variable "location" {
    type    = string
    default = "westeurope"
  }

  # main.tf
  locals {
    name = "orders-${var.environment}"
  }

  resource "azurerm_resource_group" "main" {
    name     = "rg-${local.name}"
    location = var.location
  }

  resource "azurerm_virtual_network" "main" {
    name                = "vnet-${local.name}"
    resource_group_name = azurerm_resource_group.main.name
    location            = azurerm_resource_group.main.location
    address_space       = ["10.20.0.0/16"]
  }

  resource "azurerm_subnet" "nodes" {
    name                 = "snet-nodes"
    resource_group_name  = azurerm_resource_group.main.name
    virtual_network_name = azurerm_virtual_network.main.name
    address_prefixes     = ["10.20.0.0/22"]
  }

  resource "azurerm_log_analytics_workspace" "main" {
    name                = "log-${local.name}"
    resource_group_name = azurerm_resource_group.main.name
    location            = azurerm_resource_group.main.location
    retention_in_days   = 30
  }

  data "azurerm_container_registry" "shared" {
    name                = "contosoacr"
    resource_group_name = "rg-shared"
  }

  resource "azurerm_kubernetes_cluster" "main" {
    name                      = "aks-${local.name}"
    resource_group_name       = azurerm_resource_group.main.name
    location                  = azurerm_resource_group.main.location
    dns_prefix                = "aks-${local.name}"
    sku_tier                  = "Standard"
    oidc_issuer_enabled       = true
    workload_identity_enabled = true
    local_account_disabled    = true
    automatic_upgrade_channel = "patch"
    node_os_upgrade_channel   = "NodeImage"

    default_node_pool {
      name                         = "system"
      vm_size                      = "Standard_D4ds_v5"
      node_count                   = 2
      zones                        = ["1", "2", "3"]
      vnet_subnet_id               = azurerm_subnet.nodes.id
      only_critical_addons_enabled = true
    }

    identity {
      type = "SystemAssigned"
    }

    azure_active_directory_role_based_access_control {
      azure_rbac_enabled = true
    }

    network_profile {
      network_plugin      = "azure"
      network_plugin_mode = "overlay"
      network_data_plane  = "cilium"
      pod_cidr            = "192.168.0.0/16"
      service_cidr        = "172.16.0.0/16"
      dns_service_ip      = "172.16.0.10"
    }

    oms_agent {
      log_analytics_workspace_id = azurerm_log_analytics_workspace.main.id
    }
  }

  resource "azurerm_kubernetes_cluster_node_pool" "user" {
    name                  = "user"
    kubernetes_cluster_id = azurerm_kubernetes_cluster.main.id
    mode                  = "User"
    vm_size               = "Standard_D4ds_v5"
    zones                 = ["1", "2", "3"]
    vnet_subnet_id        = azurerm_subnet.nodes.id
    auto_scaling_enabled  = true
    min_count             = 2
    max_count             = 6
  }

  resource "azurerm_role_assignment" "kubelet_acr_pull" {
    scope                = data.azurerm_container_registry.shared.id
    role_definition_name = "AcrPull"
    principal_id         = azurerm_kubernetes_cluster.main.kubelet_identity[0].object_id
    principal_type       = "ServicePrincipal"
  }

  resource "azurerm_user_assigned_identity" "orders_api" {
    name                = "id-orders-api-${var.environment}"
    resource_group_name = azurerm_resource_group.main.name
    location            = azurerm_resource_group.main.location
  }

  resource "azurerm_federated_identity_credential" "orders_api" {
    name                = "orders-api"
    resource_group_name = azurerm_resource_group.main.name
    parent_id           = azurerm_user_assigned_identity.orders_api.id
    audience            = ["api://AzureADTokenExchange"]
    issuer              = azurerm_kubernetes_cluster.main.oidc_issuer_url
    subject             = "system:serviceaccount:orders:orders-api"
  }

  # outputs.tf
  output "cluster_name" {
    value = azurerm_kubernetes_cluster.main.name
  }

  output "orders_api_client_id" {
    value = azurerm_user_assigned_identity.orders_api.client_id
  }
---
lab: ch12/lab-b
solution: |
  trigger:
    branches:
      include: [main]
    paths:
      include: [infra/terraform/*]
  pr:
    branches:
      include: [main]

  variables:
    workDir: infra/terraform/envs/prod

  stages:
    - stage: Checks
      jobs:
        - job: lint
          pool: { vmImage: ubuntu-latest }
          steps:
            - script: terraform fmt -check -recursive
              workingDirectory: $(workDir)
            - script: terraform init -backend=false && terraform validate
              workingDirectory: $(workDir)
            - script: tflint --recursive && checkov -d .
              workingDirectory: $(workDir)

    - stage: Plan
      dependsOn: Checks
      jobs:
        - job: plan
          pool:
            name: pool-orders-prod
          steps:
            - task: AzureCLI@2
              displayName: terraform plan
              inputs:
                azureSubscription: sc-orders-infra-prod   # workload identity federation
                scriptType: bash
                scriptLocation: inlineScript
                addSpnToEnvironment: true
                workingDirectory: $(workDir)
                inlineScript: |
                  export ARM_CLIENT_ID=$servicePrincipalId ARM_TENANT_ID=$tenantId ARM_OIDC_TOKEN=$idToken
                  terraform init -input=false
                  terraform plan -input=false -out=tfplan
              env:
                ARM_USE_OIDC: true
                ARM_SUBSCRIPTION_ID: $(subscriptionId)
            - publish: $(workDir)/tfplan
              artifact: tfplan

    - stage: Apply
      dependsOn: Plan
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
        - deployment: apply
          pool:
            name: pool-orders-prod
          environment: infra-prod          # approval check on this environment
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                  - download: current
                    artifact: tfplan
                  - task: AzureCLI@2
                    displayName: terraform apply (the approved plan)
                    inputs:
                      azureSubscription: sc-orders-infra-prod
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      workingDirectory: $(workDir)
                      inlineScript: |
                        export ARM_CLIENT_ID=$servicePrincipalId ARM_TENANT_ID=$tenantId ARM_OIDC_TOKEN=$idToken
                        cp $(Pipeline.Workspace)/tfplan/tfplan .
                        terraform init -input=false
                        terraform apply -input=false tfplan
                    env:
                      ARM_USE_OIDC: true
                      ARM_SUBSCRIPTION_ID: $(subscriptionId)
---
lab: ch13/lab
solution: |
  // main.bicep
  @allowed([
    'dev'
    'prod'
  ])
  param environment string
  param location string = resourceGroup().location

  var name = 'orders-${environment}'

  resource vnet 'Microsoft.Network/virtualNetworks@2024-05-01' = {
    name: 'vnet-${name}'
    location: location
    properties: {
      addressSpace: { addressPrefixes: ['10.20.0.0/16'] }
      subnets: [
        {
          name: 'snet-nodes'
          properties: { addressPrefix: '10.20.0.0/22' }
        }
      ]
    }
  }

  resource acr 'Microsoft.ContainerRegistry/registries@2023-07-01' existing = {
    name: 'contosoacr'
    scope: resourceGroup('rg-shared')
  }

  resource aks 'Microsoft.ContainerService/managedClusters@2024-09-01' = {
    name: 'aks-${name}'
    location: location
    sku: { name: 'Base', tier: 'Standard' }
    identity: { type: 'SystemAssigned' }
    properties: {
      dnsPrefix: 'aks-${name}'
      disableLocalAccounts: true
      aadProfile: {
        managed: true
        enableAzureRBAC: true
      }
      oidcIssuerProfile: { enabled: true }
      securityProfile: {
        workloadIdentity: { enabled: true }
      }
      networkProfile: {
        networkPlugin: 'azure'
        networkPluginMode: 'overlay'
        networkDataplane: 'cilium'
        podCidr: '192.168.0.0/16'
        serviceCidr: '172.16.0.0/16'
        dnsServiceIP: '172.16.0.10'
      }
      agentPoolProfiles: [
        {
          name: 'system'
          mode: 'System'
          vmSize: 'Standard_D4ds_v5'
          count: 2
          availabilityZones: ['1', '2', '3']
          vnetSubnetID: vnet.properties.subnets[0].id
          nodeTaints: ['CriticalAddonsOnly=true:NoSchedule']
        }
      ]
    }
  }

  // AcrPull for the kubelet identity, on the shared registry
  module acrPull 'modules/acr-pull.bicep' = {
    name: 'acr-pull-${name}'
    scope: resourceGroup('rg-shared')
    params: {
      acrName: acr.name
      principalId: aks.properties.identityProfile.kubeletidentity.objectId
    }
  }

  resource ordersApiId 'Microsoft.ManagedIdentity/userAssignedIdentities@2023-01-31' = {
    name: 'id-orders-api-${environment}'
    location: location
  }

