[package]
name = "kq-server"
version = "0.1.0"
edition = "2021"
description = "Backend for the Kubernetes → AKS → DevOps on Azure course: content API, graders and progress store"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
scraper = "0.20"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1"

[profile.release]
opt-level = 3
strip = true
